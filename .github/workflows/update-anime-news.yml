# ============================================================================
# GitHub Actions: Ежедневное обновление новостей аниме
# ============================================================================
# Запускается каждый день в 06:00 UTC (09:00 МСК)
# Получает актуальные данные из AniList API
# Сохраняет в /data/current-season-anime.json
# Автоматически создает коммит если данные изменились
# ============================================================================

name: 🔄 Обновление аниме-новостей

on:
  # Автоматический запуск каждый день в 06:00 UTC
  schedule:
    - cron: "0 6 * * *"

  # Возможность ручного запуска из интерфейса GitHub
  workflow_dispatch:
    inputs:
      season:
        description: "Сезон (оставьте пустым для автоопределения)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - winter
          - spring
          - summer
          - fall

# Права для создания коммитов
permissions:
  contents: write

jobs:
  update-anime:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем репозиторий
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Шаг 2: Установка Node.js
      - name: 🔧 Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Шаг 3: Запуск скрипта обновления
      - name: 🎯 Обновление данных аниме
        run: node .github/scripts/update-anime-json.js
        env:
          SEASON_OVERRIDE: ${{ github.event.inputs.season || 'auto' }}

      # Шаг 4: Проверка изменений и создание коммита
      - name: 💾 Сохранение изменений
        run: |
          # Проверяем, изменился ли файл
          if git diff --quiet data/current-season-anime.json; then
            echo "📭 Нет изменений - данные актуальны"
            exit 0
          fi

          echo "📝 Обнаружены изменения, создаю коммит..."

          # Настраиваем git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Получаем текущий сезон для сообщения коммита
          SEASON=$(node -e "const m=new Date().getMonth();console.log(m<3?'winter':m<6?'spring':m<9?'summer':'fall')")

          # Коммитим и пушим
          git add data/current-season-anime.json
          git commit -m "🔄 Обновление аниме-новостей [${SEASON}] $(date +%Y-%m-%d)"
          git push

      # Шаг 5: Уведомление об ошибке (опционально)
      - name: 🚨 Уведомление при ошибке
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Ошибка обновления аниме-новостей',
              body: `Автоматическое обновление не удалось.\n\nДата: ${new Date().toISOString()}\nСсылка на запуск: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated']
            });
            console.log(`Создано issue #${issue.data.number}`);
