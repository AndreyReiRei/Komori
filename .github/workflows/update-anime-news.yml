name: 🔄 Обновление аниме

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Обновление JSON с аниме
        run: |
          # Определяем сезон
          MONTH=$(date +%-m)
          if [ $MONTH -le 3 ]; then SEASON="WINTER"; SEASON_RU="❄️ Зима"; fi
          if [ $MONTH -ge 4 ] && [ $MONTH -le 6 ]; then SEASON="SPRING"; SEASON_RU="🌸 Весна"; fi
          if [ $MONTH -ge 7 ] && [ $MONTH -le 9 ]; then SEASON="SUMMER"; SEASON_RU="☀️ Лето"; fi
          if [ $MONTH -ge 10 ]; then SEASON="FALL"; SEASON_RU="🍂 Осень"; fi

          YEAR=$(date +%Y)
          echo "📅 Сезон: $SEASON_RU $YEAR"

          # Запрос к AniList API
          RESPONSE=$(curl -s -X POST https://graphql.anilist.co \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"query { Page(perPage: 9) { media(season: $SEASON, seasonYear: $YEAR, status: RELEASING, sort: POPULARITY_DESC, type: ANIME, countryOfOrigin: JP) { id idMal title { romaji english native } description coverImage { extraLarge large } format episodes averageScore genres studios { nodes { name } } siteUrl } } }\"
            }")

          # Парсим JSON и создаем наш формат
          echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          media = data['data']['Page']['media']

          result = []
          for a in media:
              desc = (a.get('description') or '')[:200]
              desc = desc.replace('<', ' ').replace('>', ' ').strip()
              
              result.append({
                  'id': f'al-{a[\"id\"]}',
                  'malId': a.get('idMal'),
                  'title': a['title'].get('english') or a['title'].get('romaji') or 'Без названия',
                  'titleJapanese': a['title'].get('native'),
                  'description': desc,
                  'image': (a.get('coverImage') or {}).get('extraLarge') or (a.get('coverImage') or {}).get('large'),
                  'type': a.get('format', 'TV'),
                  'episodes': a.get('episodes'),
                  'score': round((a.get('averageScore') or 0) / 10, 1),
                  'genres': a.get('genres', []),
                  'studios': [s['name'] for s in (a.get('studios') or {}).get('nodes', [])],
                  'source': 'AniList',
                  'url': a.get('siteUrl', '#')
              })

          output = {
              'lastUpdated': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
              'season': '$SEASON_RU',
              'year': $YEAR,
              'totalCount': len(result),
              'source': 'AniList API (автообновление)',
              'anime': result
          }

          with open('data/current-season-anime.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f'✅ Сохранено {len(result)} аниме')
          for i, a in enumerate(result):
              print(f'  {i+1}. {a[\"title\"]} (★ {a[\"score\"]})')
          "

          # Создаем папку data если её нет
          mkdir -p data

      - name: 💾 Коммит изменений
        run: |
          if git diff --quiet data/current-season-anime.json; then
            echo "Изменений нет"
          else
            git config user.name "🤖 Anime Bot"
            git config user.email "bot@komori.ru"
            git add data/current-season-anime.json
            git commit -m "🔄 Обновление аниме: $(date +%Y-%m-%d)"
            git push
          fi
